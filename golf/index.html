<!doctype html>
<html lang="en">
<head>
  <!-- Nomad Code site icon -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golf Leaderboard</title>
<style>
  :root{
    --bg:#0f1512; --card:#18211d; --line:#25322c; --fg:#e8f0ea; --dim:#8aa295;
    --good:#4ade80; --bad:#f87171; --even:#cbd5c8; --accent:#3ddc84;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f7f4; --card:#ffffff; --line:#e2e8e2; --fg:#12201a; --dim:#5c6f65;
           --good:#15803d; --bad:#b91c1c; --even:#33413a; --accent:#15803d; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased}
  header{padding:20px 16px 8px;max-width:820px;margin:0 auto}
  h1{margin:0;font-size:20px;letter-spacing:.2px}
  .sub{color:var(--dim);font-size:13px;margin-top:3px}
  .wrap{max-width:820px;margin:0 auto;padding:8px 12px 48px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
  .pos{width:22px;text-align:center;color:var(--dim);font-variant-numeric:tabular-nums}
  .who{flex:1;min-width:0}
  .who .alias{font-weight:640;font-size:16px}
  .who .last{color:var(--dim);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topar{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
  .thru{color:var(--dim);font-size:12px;min-width:52px;text-align:right}
  .neg{color:var(--good)} .pos-s{color:var(--bad)} .eve{color:var(--even)}
  .detail{display:none;border-top:1px solid var(--line);padding:10px 14px 14px}
  .card.open .detail{display:block}
  .sg{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px}
  .chip{font-size:12px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;color:var(--dim)}
  .chip b{color:var(--fg);font-weight:600}
  .holes{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
  @media(max-width:520px){.holes{grid-template-columns:repeat(6,1fr)}}
  .h{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 2px;text-align:center}
  .h .n{font-size:10px;color:var(--dim)}
  .h .s{font-weight:640;font-variant-numeric:tabular-nums}
  .h.bird{border-color:var(--good)} .h.bogey{border-color:var(--bad)}
  .h.playing{outline:2px solid var(--accent);outline-offset:-1px}
  .foot{color:var(--dim);font-size:12px;text-align:center;margin-top:18px}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);
       margin-right:6px;vertical-align:middle;animation:p 1.6s infinite}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
  .empty{color:var(--dim);text-align:center;padding:40px 0}
  /* table (standings) */
  table{width:100%;border-collapse:collapse}
  thead th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--dim);font-weight:600;
           text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
  thead th.l,tbody td.l{text-align:left}
  tbody td{padding:11px 8px;text-align:right;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line)}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--card)}
  .name{font-weight:640;font-size:15px}
  .muted{color:var(--dim);font-size:12px}
  .back{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--accent);
        font-size:14px;padding:8px 2px;user-select:none}
  .live{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--accent);
        border-radius:12px;padding:12px 14px;margin:10px 0;cursor:pointer}
  .live .txt{flex:1}.live .go{color:var(--accent);font-size:13px}
  .pill{font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--accent);border:1px solid var(--accent);
        border-radius:999px;padding:1px 7px}
</style>
</head>
<body>
<header>
  <h1 id="title">Golf Leaderboard</h1>
  <div class="sub" id="sub"><span id="submeta">loadingâ€¦</span></div>
</header>
<div class="wrap" id="board"><div class="empty">Loadingâ€¦</div></div>

<script>
// Deterministic viewer: polls the same-repo data files the streamer/ingester push. No frameworks, no external calls.
const POLL_MS = 5000;
const LIVE_WINDOW_MS = 40 * 60 * 1000;   // a round updated within this window is treated as LIVE
const fmtToPar = n => n == null ? 'â€”' : (n === 0 ? 'E' : (n > 0 ? '+'+n : ''+n));
const cls = n => n < 0 ? 'neg' : (n > 0 ? 'pos-s' : 'eve');
// score-only rounds (backfilled from GSPro.db) carry sgTotal/sg/par = null â€” render dashes, never "null"
const fmtSg = v => v == null ? 'â€”' : (v > 0 ? '+'+v : ''+v);
const asArr = x => Array.isArray(x) ? x : (x ? [x] : []);

let view = {name:'standings', arg:null};   // name: standings | player | round
let cache = {standings:null, index:null, live:null};

async function getJSON(path){
  const r = await fetch(path + '?t=' + Date.now(), {cache:'no-store'});
  if(!r.ok) throw new Error(r.status);
  return r.json();
}
function isLive(lb){ return lb && lb.round && lb.round.updated && (Date.now() - new Date(lb.round.updated).getTime() < LIVE_WINDOW_MS); }

// ---------- round detail (per-round board: reused for a picked round AND the live round) ----------
function holeCell(h){
  const rel = h.par == null ? 0 : h.strokes - h.par;   // null par (course csv missing) -> neutral cell, not bogey
  let k = 'h';
  if (!h.complete) k += ' playing';
  else if (rel < 0) k += ' bird';
  else if (rel > 0) k += ' bogey';
  return `<div class="${k}"><div class="n">${h.hole}</div><div class="s">${h.complete?h.strokes:'â€¦'}</div></div>`;
}
function playerCard(p, i){
  const sg = p.sg || {};
  const chips = Object.keys(sg).map(k => `<span class="chip">${k} <b class="${cls(sg[k])}">${sg[k]>0?'+':''}${sg[k]}</b></span>`).join('');
  const ls = p.lastShot || {};
  const lastTxt = ls.hole ? `last: H${ls.hole} #${ls.shot} Â· ${ls.club||'â€”'} Â· ${ls.ballSpeed||'â€”'} mph${ls.carry?` Â· ${ls.carry}y carry`:''}` : '';
  const holes = asArr(p.holes).map(holeCell).join('');
  return `<div class="card" data-i="${i}">
    <div class="row" onclick="this.parentNode.classList.toggle('open')">
      <div class="pos">${i+1}</div>
      <div class="who"><div class="alias">${p.alias}</div><div class="last">${lastTxt}</div></div>
      <div class="thru">${p.thru>=18?'F':'thru '+p.thru}</div>
      <div class="topar ${cls(p.toParNum)}">${fmtToPar(p.toParNum)}</div>
    </div>
    <div class="detail">
      <div class="sg">${p.sgTotal==null
        ? '<span class="chip">score only</span>'
        : `<span class="chip">SG total <b class="${cls(p.sgTotal)}">${fmtSg(p.sgTotal)}</b></span>${chips}`}</div>
      <div class="holes">${holes}</div>
    </div>
  </div>`;
}
function renderRound(lb, live){
  const players = asArr(lb.players);
  const r = lb.round || {};
  document.getElementById('title').textContent = (live?'LIVE Â· ':'') + (r.course||'Round').replace(/_gsp$/,'').replace(/_/g,' ');
  document.getElementById('submeta').innerHTML =
    `${live?'<span class="dot"></span>':''}round ${r.id} Â· ${r.date||''} Â· ${r.scoreOnly?'score only':(r.shots||0)+' shots'}`;
  const back = `<div class="back" onclick="go('standings')">â† standings</div>`;
  document.getElementById('board').innerHTML = back + (players.length ? players.map(playerCard).join('') : '<div class="empty">No shots yetâ€¦</div>');
}

// ---------- player detail (a player's rounds) ----------
function renderPlayer(alias){
  const idx = asArr(cache.index).slice().sort((a,b)=> b.id - a.id);
  const st = asArr(cache.standings && cache.standings.players).find(p=>p.alias===alias);
  const rows = idx.map(rd => {
    const me = asArr(rd.players).find(p=>p.alias===alias);
    if(!me) return '';
    const course = (rd.course||'').replace(/_gsp$/,'').replace(/_/g,' ');
    return `<tr onclick="go('round',${rd.id})">
      <td class="l"><div class="name">Round ${rd.id}</div><div class="muted">${rd.date||''} Â· ${course}</div></td>
      <td class="muted">${me.thru}h</td>
      <td class="${cls(me.toParNum)}">${me.toPar==null?'â€”':me.toPar}</td>
      <td class="${cls(me.sgTotal)}">${fmtSg(me.sgTotal)}</td>
    </tr>`;
  }).join('');
  let summary = '';
  if(st){
    const sg = st.sg||{};
    const chips = Object.keys(sg).map(k=>`<span class="chip">${k} <b class="${cls(sg[k])}">${sg[k]>0?'+':''}${sg[k]}</b></span>`).join('');
    summary = `<div class="sg" style="margin:6px 0 14px">
      <span class="chip">rounds <b>${st.rounds}</b></span>
      <span class="chip">avg/18 <b class="${cls(st.avgToPar18)}">${st.avgToParDisp}</b></span>
      <span class="chip">avg SG <b class="${cls(st.avgSgTotal)}">${fmtSg(st.avgSgTotal)}</b></span>${chips}</div>`;
  }
  document.getElementById('title').textContent = alias;
  document.getElementById('submeta').textContent = 'round history';
  document.getElementById('board').innerHTML =
    `<div class="back" onclick="go('standings')">â† standings</div>${summary}
     <table><thead><tr><th class="l">Round</th><th>Thru</th><th>To&nbsp;par</th><th>SG</th></tr></thead>
     <tbody>${rows||'<tr><td class="l muted" colspan="4">No rounds.</td></tr>'}</tbody></table>`;
}

// ---------- standings (default) ----------
function renderStandings(){
  const st = cache.standings || {};
  const players = asArr(st.players);
  document.getElementById('title').textContent = 'All-Time Leaderboard';
  document.getElementById('submeta').textContent =
    `${st.rounds||0} rounds Â· ${players.length} players Â· min 9 holes Â· updated ${st.updated?new Date(st.updated).toLocaleDateString():''}`;
  let html = '';
  const lb = cache.live;
  if(isLive(lb)){
    const course = (lb.round.course||'').replace(/_gsp$/,'').replace(/_/g,' ');
    const lead = asArr(lb.players)[0];
    html += `<div class="live" onclick="go('round',${lb.round.id})">
      <span class="pill">LIVE</span>
      <div class="txt"><b>Round ${lb.round.id}</b> Â· ${course}${lead?` â€” ${lead.alias} ${lead.toPar} thru ${lead.thru}`:''}</div>
      <span class="go">watch â†’</span></div>`;
  }
  const rows = players.map((p,i)=>`<tr onclick="go('player','${p.alias}')">
      <td class="muted">${i+1}</td>
      <td class="l"><span class="name">${p.alias}</span></td>
      <td class="muted">${p.rounds}</td>
      <td class="${cls(p.avgToPar18)}">${p.avgToParDisp}</td>
      <td class="muted">${p.best?p.best.toPar:''}</td>
      <td class="${cls(p.avgSgTotal)}">${fmtSg(p.avgSgTotal)}</td>
    </tr>`).join('');
  html += `<table><thead><tr>
      <th>#</th><th class="l">Player</th><th>Rds</th><th>Avg/18</th><th>Best</th><th>Avg&nbsp;SG</th>
    </tr></thead><tbody>${rows||'<tr><td class="l muted" colspan="6">No rounds ingested yet.</td></tr>'}</tbody></table>`;
  document.getElementById('board').innerHTML = html;
}

// ---------- nav ----------
async function go(name, arg){
  view = {name, arg};
  try{
    if(name==='round'){
      // prefer the live pointer if it's the same round, else the per-round file
      let lb = cache.live;
      if(!lb || !lb.round || lb.round.id != arg){ lb = await getJSON('./data/rounds/'+arg+'.json'); }
      renderRound(lb, isLive(lb) && lb.round.id==arg);
    } else if(name==='player'){
      renderPlayer(arg);
    } else {
      renderStandings();
    }
  }catch(e){
    document.getElementById('board').innerHTML = `<div class="back" onclick="go('standings')">â† standings</div><div class="empty">Could not load (${e.message}).</div>`;
  }
}

async function tick(){
  try{
    cache.standings = await getJSON('./data/standings.json');
    cache.index = await getJSON('./data/rounds_index.json');
  }catch(e){ /* standings may not exist until first ingest */ }
  try{ cache.live = await getJSON('./data/leaderboard.json'); }catch(e){ cache.live = null; }
  // re-render whatever view is active (keeps standings + live banner fresh; round view auto-refreshes when live)
  if(view.name==='standings') renderStandings();
  else if(view.name==='round') go('round', view.arg);
  else if(view.name==='player') renderPlayer(view.arg);
}
tick(); setInterval(tick, POLL_MS);
</script>
</body>
</html>
